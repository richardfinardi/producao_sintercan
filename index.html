<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sintercan - Portal de Gestão</title>
    <link rel="icon" type="image/png" href="LOGO MINIMALISTA.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-center items-center p-4">

    <!-- TELA DE LOGIN -->
    <div id="loginBox" class="w-full max-w-md bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <img src="./logo.png" alt="Sintercan Logo" class="h-12 mx-auto object-contain" onerror="this.style.display='none'">
            <h1 class="text-2xl font-black text-white">Sintercan</h1>
            <p class="text-xs text-slate-400">Informe seu usuário e senha do sistema</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1">USUÁRIO</label>
                <input type="text" id="userInput" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1">SENHA</label>
                <input type="password" id="passInput" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
            </div>

            <p id="errorMsg" class="text-xs text-red-400 hidden font-bold text-center"></p>

            <button type="submit" id="btnLogin" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold py-3 rounded-xl transition text-sm flex items-center justify-center gap-2">
                <span>Entrar no Sistema</span>
            </button>
        </form>
    </div>

    <!-- PAINEL / MENU PRINCIPAL -->
    <div id="menuBox" class="hidden w-full max-w-5xl bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl space-y-6">
        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
            <div class="flex items-center gap-4">
                <img src="./logo.png" alt="Sintercan Logo" class="h-10 object-contain" onerror="this.style.display='none'">
                <div>
                    <h1 class="text-xl font-black text-white">Sintercan</h1>
                    <p class="text-xs text-slate-400">Usuário: <span id="lblUser" class="text-amber-400 font-bold"></span></p>
                </div>
            </div>
            <button onclick="logout()" class="px-3 py-1.5 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
                <i data-lucide="log-out" class="w-4 h-4"></i> Sair
            </button>
        </div>

        <div>
            <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-4">Módulos Disponíveis</h2>
            <div id="gridModules" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Botões dinâmicos dos módulos -->
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://sintercan.consultoriarf.net';

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            checkSession();
        });

        function checkSession() {
            const userData = localStorage.getItem('sintercan_user');
            if (userData) {
                const user = JSON.parse(userData);
                showMenu(user);
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const usuario = document.getElementById('userInput').value.trim();
            const senha = document.getElementById('passInput').value;
            const errorMsg = document.getElementById('errorMsg');
            const btnLogin = document.getElementById('btnLogin');

            errorMsg.classList.add('hidden');
            btnLogin.disabled = true;
            btnLogin.innerText = "Autenticando...";

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, senha })
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || 'Usuário ou senha incorretos.');
                }

                const data = await res.json();
                localStorage.setItem('sintercan_user', JSON.stringify(data));
                showMenu(data);

            } catch (err) {
                errorMsg.innerText = err.message;
                errorMsg.classList.remove('hidden');
            } finally {
                btnLogin.disabled = false;
                btnLogin.innerText = "Entrar no Sistema";
            }
        }

        function showMenu(user) {
            document.getElementById('loginBox').classList.add('hidden');
            document.getElementById('menuBox').classList.remove('hidden');
            document.getElementById('lblUser').innerText = user.nome;

            const grid = document.getElementById('gridModules');
            grid.innerHTML = '';

            // Mapeamento dos módulos com base na tabela csenha
            const modules = [
                {
                    key: 'producao',
                    label: 'Controle Semanal de Produção',
                    url: './producao/',
                    icon: 'factory',
                    hasAccess: Number(user.u_producao) === 1 || Number(user.u_producao_valor) === 1
                },
                {
                    key: 'u_estoque_pa',
                    label: 'Estoque de Produto Acabado',
                    url: './estoque/',
                    icon: 'boxes',
                    hasAccess: Number(user.u_estoque_pa) === 1
                },
                {
                    key: 'u_estoque_mp',
                    label: 'Estoque de Matéria Prima',
                    url: './sc/',
                    icon: 'package',
                    hasAccess: Number(user.u_estoque_mp) === 1
                },
                {
                    key: 'u_faturamento',
                    label: 'Faturamento',
                    url: './faturamento/',
                    icon: 'receipt',
                    hasAccess: Number(user.u_faturamento) === 1
                },
                {
                    key: 'u_qualidade',
                    label: 'Qualidade',
                    url: './qualidade/',
                    icon: 'check-circle-2',
                    hasAccess: Number(user.u_qualidade) === 1
                },
                {
                    key: 'u_financeiro',
                    label: 'Financeiro',
                    url: './financeiro/',
                    icon: 'dollar-sign',
                    hasAccess: Number(user.u_financeiro) === 1
                },
                {
                    key: 'u_rs',
                    label: 'RS',
                    url: './rs/',
                    icon: 'bar-chart-3',
                    hasAccess: Number(user.u_rs) === 1
                },
                {
                    key: 'u_compras',
                    label: 'Compras',
                    url: './compras/',
                    icon: 'shopping-cart',
                    hasAccess: Number(user.u_compras) === 1
                },
                {
                    key: 'u_custos',
                    label: 'Custos',
                    url: './custos/',
                    icon: 'pie-chart',
                    hasAccess: Number(user.u_custos) === 1
                }
            ];

            modules.forEach(mod => {
                if (mod.hasAccess) {
                    const card = document.createElement('a');
                    card.href = mod.url;
                    card.className = "flex items-center gap-4 p-4 bg-slate-950 border border-slate-800 rounded-xl hover:border-amber-500 hover:shadow-lg transition cursor-pointer group";
                    card.innerHTML = `
                        <div class="p-3 bg-slate-900 group-hover:bg-amber-500 text-amber-400 group-hover:text-slate-950 rounded-xl transition">
                            <i data-lucide="${mod.icon}" class="w-6 h-6"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-sm text-white group-hover:text-amber-400 transition">${mod.label}</h3>
                            <span class="text-[10px] text-slate-500">Acessar Módulo</span>
                        </div>
                    `;
                    grid.appendChild(card);
                }
            });

            lucide.createIcons();
        }

        function logout() {
            localStorage.removeItem('sintercan_user');
            document.getElementById('menuBox').classList.add('hidden');
            document.getElementById('loginBox').classList.remove('hidden');
            document.getElementById('userInput').value = '';
            document.getElementById('passInput').value = '';
        }
    </script>
</body>
</html>
