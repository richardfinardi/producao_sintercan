<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CONTROLE DE PEÇAS SINTERCAN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .active-tab { background-color: #262626 !important; color: #ffffff !important; }
    table { border-collapse: collapse; width: 100%; }
    th { border-bottom: 2px solid #0078d4; color: #333; font-weight: 600; font-size: 11px; padding: 4px; text-align: left; }
    td { font-size: 11px; padding: 4px; color: #1a1a1a; white-space: nowrap; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    tr:hover { background-color: #edf2f7; }
    .slicer-label { background-color: #000; color: #fff; font-size: 11px; font-weight: bold; padding: 2px 6px; }
  </style>
</head>
<body class="p-4 flex flex-col min-h-screen">

  <div class="bg-white border border-gray-300 rounded shadow-md p-4 flex-grow flex flex-col max-w-[1600px] w-full mx-auto">

    <!-- Header -->
    <header class="flex justify-between items-center mb-3">
      <div class="flex items-center gap-2">
        <div class="bg-amber-500 text-white font-bold p-1 rounded text-lg">⚙</div>
        <div>
          <h1 class="text-xs font-bold uppercase text-gray-700 leading-none">SINTERCAN</h1>
          <span class="text-[9px] text-gray-400 leading-none">Usinagem e Ferramentaria de Precisão</span>
        </div>
      </div>

      <h2 class="text-xl font-normal tracking-wide text-gray-800 uppercase">
        CONTROLE DE PEÇAS SINTERCAN
      </h2>

      <div class="border-2 border-gray-400 bg-white px-6 py-1 text-center min-w-[120px]">
        <span id="kpi-count" class="block text-3xl font-bold text-gray-800 leading-none">0</span>
        <span class="text-[10px] font-bold text-gray-500 tracking-widest uppercase">ITENS</span>
      </div>
    </header>

    <!-- NAVEGAÇÃO ENTRE ABAS (TOPO) -->
    <nav class="grid grid-cols-2 sm:grid-cols-5 gap-2 mb-4">
      <button data-tab="estoque" class="tab-btn active-tab border border-gray-800 text-gray-800 font-bold py-1.5 rounded text-xs uppercase transition">
        EM ESTOQUE
      </button>
      <button data-tab="orcamento" class="tab-btn border border-gray-800 text-gray-800 font-bold py-1.5 rounded text-xs uppercase transition">
        EM ESTOQUE PARA ORÇAMENTO
      </button>
      <button data-tab="produzindo" class="tab-btn border border-gray-800 text-gray-800 font-bold py-1.5 rounded text-xs uppercase transition">
        PRODUZINDO
      </button>
      <button data-tab="entregues" class="tab-btn border border-gray-800 text-gray-800 font-bold py-1.5 rounded text-xs uppercase transition">
        ENTREGUES
      </button>
      <button data-tab="parciais" class="tab-btn border border-gray-800 text-gray-800 font-bold py-1.5 rounded text-xs uppercase transition">
        PARCIAIS
      </button>
    </nav>

    <!-- Filtros de Topo (Slicers) -->
    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-4">
      <div>
        <div class="slicer-label">OS Destino</div>
        <select id="filter-os" class="w-full border border-gray-400 p-1 text-xs bg-white focus:outline-none">
          <option value="">Todos</option>
        </select>
      </div>

      <div>
        <div class="slicer-label">Cód. Produto</div>
        <select id="filter-cod-produto" class="w-full border border-gray-400 p-1 text-xs bg-white focus:outline-none">
          <option value="">Todos</option>
        </select>
      </div>

      <div>
        <div class="slicer-label">cliente</div>
        <select id="filter-cliente" class="w-full border border-gray-400 p-1 text-xs bg-white focus:outline-none">
          <option value="">Todos</option>
        </select>
      </div>

      <div id="container-os-prod" class="hidden">
        <div class="slicer-label">OS produzindo</div>
        <select id="filter-os-prod" class="w-full border border-gray-400 p-1 text-xs bg-white focus:outline-none">
          <option value="">Todos</option>
        </select>
      </div>
    </section>

    <!-- Tabela Principal -->
    <main class="flex-grow overflow-auto border border-gray-300 min-h-[420px]">
      <table>
        <thead class="bg-white sticky top-0">
          <tr id="table-header"></tr>
        </thead>
        <tbody id="table-body"></tbody>
        <tfoot class="bg-white font-bold border-t-2 border-blue-500 sticky bottom-0">
          <tr id="table-footer"></tr>
        </tfoot>
      </table>
    </main>

  </div>

  <script>
    const API_URL = 'https://sintercan.consultoriarf.net/estoque_sc';
    let rawData = [];
    let currentTab = 'estoque';

    // Regras de Colunas + Filtros por Abas
    const tabConfigs = {
      estoque: {
        cols: [
          { label: 'OS Destino', key: 'n_os' },
          { label: 'Item/Serviço', key: 'titulo' },
          { label: 'Cod OS completo', key: 'cod_os_completo' },
          { label: 'Cód. Produto:', key: 'codigo_interno' },
          { label: 'Peça', key: 'nome' },
          { label: 'Disponivel', key: 'qtde_disponivel', align: 'right', sum: true },
          { label: 'n_orcamento', key: 'n_orcamento', align: 'right' },
          { label: 'cliente', key: 'cliente' }
        ],
        filter: item => Number(item.qtde_disponivel) > 0
      },
      orcamento: {
        cols: [
          { label: 'Orçamento', key: 'n_orcamento' },
          { label: 'Cliente', key: 'cliente' },
          { label: 'Cód. Produto', key: 'codigo_interno' },
          { label: 'Item', key: 'nome' },
          { label: 'Qtde. Reservada', key: 'qtde_reservada', align: 'right', sum: true }
        ],
        filter: item => item.n_orcamento !== null && item.n_orcamento !== "" && Number(item.qtde_reservada) > 0
      },
      produzindo: {
        cols: [
          { label: 'OS Destino', key: 'n_os' },
          { label: 'Item/Serviço', key: 'titulo' },
          { label: 'Cod OS completo', key: 'cod_os_completo' },
          { label: 'Cód. Produto:', key: 'codigo_interno' },
          { label: 'Peça', key: 'nome' },
          { label: 'OS produzindo', key: 'cod_solicitacao' },
          { label: 'Qtde', key: 'qtde_produzindo', align: 'right', sum: true },
          { label: 'n_orcamento', key: 'n_orcamento', align: 'right' },
          { label: 'cliente', key: 'cliente' }
        ],
        filter: item => Number(item.qtde_produzindo) > 0
      },
      entregues: {
        cols: [
          { label: 'OS Destino', key: 'n_os' },
          { label: 'Item/Serviço', key: 'titulo' },
          { label: 'Cod OS completo', key: 'cod_os_completo' },
          { label: 'Cód. Produto:', key: 'codigo_interno' },
          { label: 'Peça', key: 'nome' },
          { label: 'OS produzindo', key: 'cod_solicitacao' },
          { label: 'n_orcamento', key: 'n_orcamento' },
          { label: 'cliente', key: 'cliente' }
        ],
        filter: item => item.entregue && String(item.entregue).toLowerCase().includes('total')
      },
      parciais: {
        cols: [
          { label: 'OS Destino', key: 'n_os' },
          { label: 'Item/Serviço', key: 'titulo' },
          { label: 'Cod OS completo', key: 'cod_os_completo' },
          { label: 'Cód. Produto:', key: 'codigo_interno' },
          { label: 'Peça', key: 'nome' },
          { label: 'Situação', key: 'entregue' },
          { label: 'Solicitado', key: 'qtde_solicitada', align: 'right', sum: true },
          { label: 'Entregue', key: 'qtde_entregue', align: 'right', sum: true },
          { label: 'Disponivel', key: 'qtde_disponivel', align: 'right', sum: true },
          { label: 'Produzindo', key: 'qtde_produzindo', align: 'right', sum: true },
          { label: 'OS produzindo', key: 'cod_solicitacao' },
          { label: 'Orçamento', key: 'n_orcamento' },
          { label: 'cliente', key: 'cliente' }
        ],
        filter: item => item.entregue && String(item.entregue).toLowerCase().includes('parcial')
      }
    };

    async function fetchData() {
      try {
        const response = await fetch(API_URL);
        rawData = await response.json();
        populateFilters();
        render();
      } catch (err) {
        console.error('Erro ao buscar dados:', err);
      }
    }

    function populateFilters() {
      const fillSelect = (id, key) => {
        const select = document.getElementById(id);
        const uniqueValues = [...new Set(rawData.map(i => i[key]).filter(v => v !== null && v !== ''))].sort();
        select.innerHTML = '<option value="">Todos</option>';
        uniqueValues.forEach(val => {
          const opt = document.createElement('option');
          opt.value = val;
          opt.textContent = val;
          select.appendChild(opt);
        });
      };

      fillSelect('filter-os', 'n_os');
      fillSelect('filter-cod-produto', 'codigo_interno');
      fillSelect('filter-cliente', 'cliente');
      fillSelect('filter-os-prod', 'cod_solicitacao');
    }

    // Remove duplicatas que surgem do JOIN da API mantendo o comportamento de agregação da tabela do Power BI
    function deduplicateData(data, tab) {
      if (tab === 'produzindo' || tab === 'entregues') {
        const seen = new Set();
        return data.filter(item => {
          const key = `${item.n_os}-${item.cod_os_completo}-${item.codigo_interno}-${item.cod_solicitacao}-${item.n_orcamento}`;
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
      }
      return data;
    }

    function render() {
      const config = tabConfigs[currentTab];
      
      const osProdContainer = document.getElementById('container-os-prod');
      if (currentTab === 'produzindo' || currentTab === 'parciais') {
        osProdContainer.classList.remove('hidden');
      } else {
        osProdContainer.classList.add('hidden');
      }

      // 1. Filtragem Contextual da Aba
      let filtered = rawData.filter(config.filter);

      // 2. Desduplicação idêntica ao contexto visual do Power BI
      filtered = deduplicateData(filtered, currentTab);

      // 3. Aplicação dos Slicers do Usuário
      const osVal = document.getElementById('filter-os').value;
      const prodVal = document.getElementById('filter-cod-produto').value;
      const cliVal = document.getElementById('filter-cliente').value;
      const osProdVal = document.getElementById('filter-os-prod').value;

      if (osVal) filtered = filtered.filter(i => String(i.n_os) === osVal);
      if (prodVal) filtered = filtered.filter(i => i.codigo_interno === prodVal);
      if (cliVal) filtered = filtered.filter(i => i.cliente === cliVal);
      if (osProdVal && !osProdContainer.classList.contains('hidden')) {
        filtered = filtered.filter(i => String(i.cod_solicitacao) === osProdVal);
      }

      // Atualiza Total de ITENS (Contagem de Linhas Exata)
      document.getElementById('kpi-count').textContent = filtered.length;

      // Header
      document.getElementById('table-header').innerHTML = config.cols.map(col => `
        <th class="${col.align === 'right' ? 'text-right' : 'text-left'}">${col.label}</th>
      `).join('');

      // Body
      document.getElementById('table-body').innerHTML = filtered.map(row => `
        <tr>
          ${config.cols.map(col => `
            <td class="${col.align === 'right' ? 'text-right' : 'text-left'}">
              ${row[col.key] !== null && row[col.key] !== undefined ? row[col.key] : ''}
            </td>
          `).join('')}
        </tr>
      `).join('');

      // Footer (Soma das Colunas de Quantidade)
      document.getElementById('table-footer').innerHTML = config.cols.map((col, idx) => {
        if (idx === 0) return `<td>Total</td>`;
        if (col.sum) {
          const sum = filtered.reduce((acc, curr) => acc + (Number(curr[col.key]) || 0), 0);
          return `<td class="text-right">${sum.toLocaleString('pt-BR')}</td>`;
        }
        return `<td></td>`;
      }).join('');
    }

    // Abas
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active-tab'));
        btn.classList.add('active-tab');
        currentTab = btn.getAttribute('data-tab');
        render();
      });
    });

    // Filtros
    ['filter-os', 'filter-cod-produto', 'filter-cliente', 'filter-os-prod'].forEach(id => {
      document.getElementById(id).addEventListener('change', render);
    });

    fetchData();
  </script>
</body>
</html>
