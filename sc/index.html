<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CONTROLE DE PEÇAS SINTERCAN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Paleta Oficial Consultoria RF Dark */
    body { background-color: #070d1e; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .bg-rf-card { background-color: #0f172a; }
    .border-rf { border-color: #1e293b; }
    .active-tab { background-color: #262626 !important; color: #ffffff !important; border-color: #f59e0b !important; }
    
    table { border-collapse: collapse; width: 100%; }
    th { border-bottom: 2px solid #f59e0b; color: #cbd5e1; font-weight: 600; font-size: 11px; padding: 6px 4px; text-align: left; background-color: #070d1e; }
    td { font-size: 11px; padding: 6px 4px; color: #f1f5f9; white-space: nowrap; border-bottom: 1px solid #1e293b; }
    tr:nth-child(even) { background-color: #0b1329; }
    tr:hover { background-color: #1e293b; }
    
    .slicer-label { background-color: #000000; color: #ffffff; font-size: 11px; font-weight: bold; padding: 2px 6px; }
  </style>
</head>
<body class="p-4 flex flex-col min-h-screen">

  <div class="bg-rf-card border border-rf rounded-lg shadow-2xl p-4 flex-grow flex flex-col max-w-[1700px] w-full mx-auto">

    <!-- Header Fiel -->
    <header class="flex justify-between items-center mb-3 border-b border-rf pb-3">
      <div class="flex items-center gap-2">
        <div class="bg-amber-500 text-slate-950 font-black p-1 rounded text-lg">⚙</div>
        <div>
          <h1 class="text-xs font-bold uppercase text-slate-200 leading-none">SINTERCAN</h1>
          <span class="text-[9px] text-slate-400 leading-none">Usinagem e Ferramentaria de Precisão</span>
        </div>
      </div>

      <h2 class="text-xl font-light tracking-wide text-white uppercase">
        CONTROLE DE PEÇAS SINTERCAN
      </h2>

      <div class="border-2 border-slate-600 bg-slate-950 px-6 py-1 text-center min-w-[120px] rounded">
        <span id="kpi-count" class="block text-3xl font-bold text-white leading-none">0</span>
        <span class="text-[10px] font-bold text-slate-400 tracking-widest uppercase">ITENS</span>
      </div>
    </header>

    <!-- NAVEGAÇÃO ENTRE ABAS (NO TOPO) -->
    <nav class="grid grid-cols-2 sm:grid-cols-5 gap-2 mb-4">
      <button data-tab="estoque" class="tab-btn active-tab border border-slate-700 text-slate-300 font-bold py-1.5 rounded text-xs uppercase transition">
        EM ESTOQUE
      </button>
      <button data-tab="orcamento" class="tab-btn border border-slate-700 text-slate-300 font-bold py-1.5 rounded text-xs uppercase transition">
        EM ESTOQUE PARA ORÇAMENTO
      </button>
      <button data-tab="produzindo" class="tab-btn border border-slate-700 text-slate-300 font-bold py-1.5 rounded text-xs uppercase transition">
        PRODUZINDO
      </button>
      <button data-tab="entregues" class="tab-btn border border-slate-700 text-slate-300 font-bold py-1.5 rounded text-xs uppercase transition">
        ENTREGUES
      </button>
      <button data-tab="parciais" class="tab-btn border border-slate-700 text-slate-300 font-bold py-1.5 rounded text-xs uppercase transition">
        PARCIAIS
      </button>
    </nav>

    <!-- BUSCA GLOBAL + SLICERS -->
    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 mb-4">
      <!-- Campo de Pesquisa em Tempo Real -->
      <div class="lg:col-span-1">
        <div class="slicer-label">Pesquisar</div>
        <input type="text" id="input-search" placeholder="Buscar peça, OS, cliente..." class="w-full border border-slate-700 p-1 text-xs bg-slate-950 text-white focus:outline-none focus:border-amber-500">
      </div>

      <div>
        <div class="slicer-label">OS Destino</div>
        <select id="filter-os" class="w-full border border-slate-700 p-1 text-xs bg-slate-950 text-white focus:outline-none">
          <option value="">Todos</option>
        </select>
      </div>

      <div>
        <div class="slicer-label">Cód. Produto</div>
        <select id="filter-cod-produto" class="w-full border border-slate-700 p-1 text-xs bg-slate-950 text-white focus:outline-none">
          <option value="">Todos</option>
        </select>
      </div>

      <div>
        <div class="slicer-label">cliente</div>
        <select id="filter-cliente" class="w-full border border-slate-700 p-1 text-xs bg-slate-950 text-white focus:outline-none">
          <option value="">Todos</option>
        </select>
      </div>

      <div id="container-os-prod" class="hidden">
        <div class="slicer-label">OS produzindo</div>
        <select id="filter-os-prod" class="w-full border border-slate-700 p-1 text-xs bg-slate-950 text-white focus:outline-none">
          <option value="">Todos</option>
        </select>
      </div>
    </section>

    <!-- Tabela idêntica -->
    <main class="flex-grow overflow-auto border border-rf bg-slate-950 rounded min-h-[450px]">
      <table>
        <thead class="sticky top-0 z-10">
          <tr id="table-header"></tr>
        </thead>
        <tbody id="table-body"></tbody>
        <tfoot class="bg-slate-900 font-bold border-t-2 border-amber-500 sticky bottom-0">
          <tr id="table-footer"></tr>
        </tfoot>
      </table>
    </main>

  </div>

  <script>
    const API_URL = 'https://sintercan.consultoriarf.net/estoque_sc';
    let rawData = [];
    let currentTab = 'estoque';

    // Definição exata das Colunas por Aba do Power BI
    const tabConfigs = {
      estoque: {
        cols: [
          { label: 'OS Destino', key: 'n_os' },
          { label: 'Item/Serviço', key: 'titulo' },
          { label: 'Cod OS completo', key: 'cod_os_completo' },
          { label: 'Cód. Produto:', key: 'codigo_interno' },
          { label: 'Peça', key: 'nome' },
          { label: 'Disponivel', key: 'qtde_disponivel', align: 'right', sum: true },
          { label: 'n_orcamento', key: 'n_orcamento', align: 'right' },
          { label: 'cliente', key: 'cliente' }
        ],
        filter: item => Number(item.qtde_disponivel) > 0 || (item.entregue && String(item.entregue).toLowerCase() === 'disponivel')
      },
      orcamento: {
        cols: [
          { label: 'Orçamento', key: 'n_orcamento' },
          { label: 'Cliente', key: 'cliente' },
          { label: 'Cód. Produto', key: 'codigo_interno' },
          { label: 'Item', key: 'nome' },
          { label: 'Qtde. Reservada', key: 'qtde_reservada', align: 'right', sum: true }
        ],
        filter: item => item.n_orcamento !== null && item.n_orcamento !== "" && Number(item.qtde_reservada) > 0
      },
      produzindo: {
        cols: [
          { label: 'OS Destino', key: 'n_os' },
          { label: 'Item/Serviço', key: 'titulo' },
          { label: 'Cod OS completo', key: 'cod_os_completo' },
          { label: 'Cód. Produto:', key: 'codigo_interno' },
          { label: 'Peça', key: 'nome' },
          { label: 'OS produzindo', key: 'cod_solicitacao' },
          { label: 'Qtde', key: 'qtde_produzindo', align: 'right', sum: true },
          { label: 'n_orcamento', key: 'n_orcamento', align: 'right' },
          { label: 'cliente', key: 'cliente' }
        ],
        filter: item => Number(item.qtde_produzindo) > 0
      },
      entregues: {
        cols: [
          { label: 'OS Destino', key: 'n_os' },
          { label: 'Item/Serviço', key: 'titulo' },
          { label: 'Cod OS completo', key: 'cod_os_completo' },
          { label: 'Cód. Produto:', key: 'codigo_interno' },
          { label: 'Peça', key: 'nome' },
          { label: 'OS produzindo', key: 'cod_solicitacao' },
          { label: 'n_orcamento', key: 'n_orcamento' },
          { label: 'cliente', key: 'cliente' }
        ],
        filter: item => item.entregue && String(item.entregue).toLowerCase().includes('total')
      },
      parciais: {
        cols: [
          { label: 'OS Destino', key: 'n_os' },
          { label: 'Item/Serviço', key: 'titulo' },
          { label: 'Cod OS completo', key: 'cod_os_completo' },
          { label: 'Cód. Produto:', key: 'codigo_interno' },
          { label: 'Peça', key: 'nome' },
          { label: 'Situação', key: 'entregue' },
          { label: 'Solicitado', key: 'qtde_solicitada', align: 'right', sum: true },
          { label: 'Entregue', key: 'qtde_entregue', align: 'right', sum: true },
          { label: 'Disponivel', key: 'qtde_disponivel', align: 'right', sum: true },
          { label: 'Produzindo', key: 'qtde_produzindo', align: 'right', sum: true },
          { label: 'OS produzindo', key: 'cod_solicitacao' },
          { label: 'Orçamento', key: 'n_orcamento' },
          { label: 'cliente', key: 'cliente' }
        ],
        filter: item => item.entregue && String(item.entregue).toLowerCase().includes('parcial')
      }
    };

    async function fetchData() {
      try {
        const response = await fetch(API_URL);
        rawData = await response.json();
        populateFilters();
        render();
      } catch (err) {
        console.error('Erro ao buscar dados:', err);
      }
    }

    function populateFilters() {
      const fillSelect = (id, key) => {
        const select = document.getElementById(id);
        const uniqueValues = [...new Set(rawData.map(i => i[key]).filter(v => v !== null && v !== ''))].sort();
        select.innerHTML = '<option value="">Todos</option>';
        uniqueValues.forEach(val => {
          const opt = document.createElement('option');
          opt.value = val;
          opt.textContent = val;
          select.appendChild(opt);
        });
      };

      fillSelect('filter-os', 'n_os');
      fillSelect('filter-cod-produto', 'codigo_interno');
      fillSelect('filter-cliente', 'cliente');
      fillSelect('filter-os-prod', 'cod_solicitacao');
    }

    function deduplicateData(data, tab) {
      if (tab === 'produzindo' || tab === 'entregues') {
        const seen = new Set();
        return data.filter(item => {
          const key = `${item.n_os}-${item.cod_os_completo}-${item.codigo_interno}-${item.cod_solicitacao}-${item.n_orcamento}`;
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
      }
      return data;
    }

    function render() {
      const config = tabConfigs[currentTab];
      
      const osProdContainer = document.getElementById('container-os-prod');
      if (currentTab === 'produzindo' || currentTab === 'parciais') {
        osProdContainer.classList.remove('hidden');
      } else {
        osProdContainer.classList.add('hidden');
      }

      // 1. Filtragem por Aba
      let filtered = rawData.filter(config.filter);

      // 2. Desduplicação de Contexto
      filtered = deduplicateData(filtered, currentTab);

      // 3. Aplicação da Pesquisa Textual + Filtros Slicers
      const searchText = document.getElementById('input-search').value.toLowerCase().trim();
      const osVal = document.getElementById('filter-os').value;
      const prodVal = document.getElementById('filter-cod-produto').value;
      const cliVal = document.getElementById('filter-cliente').value;
      const osProdVal = document.getElementById('filter-os-prod').value;

      if (searchText) {
        filtered = filtered.filter(i => 
          (i.n_os && String(i.n_os).toLowerCase().includes(searchText)) ||
          (i.cod_os_completo && String(i.cod_os_completo).toLowerCase().includes(searchText)) ||
          (i.codigo_interno && String(i.codigo_interno).toLowerCase().includes(searchText)) ||
          (i.nome && String(i.nome).toLowerCase().includes(searchText)) ||
          (i.titulo && String(i.titulo).toLowerCase().includes(searchText)) ||
          (i.cliente && String(i.cliente).toLowerCase().includes(searchText))
        );
      }

      if (osVal) filtered = filtered.filter(i => String(i.n_os) === osVal);
      if (prodVal) filtered = filtered.filter(i => i.codigo_interno === prodVal);
      if (cliVal) filtered = filtered.filter(i => i.cliente === cliVal);
      if (osProdVal && !osProdContainer.classList.contains('hidden')) {
        filtered = filtered.filter(i => String(i.cod_solicitacao) === osProdVal);
      }

      // Contador no topo
      document.getElementById('kpi-count').textContent = filtered.length;

      // Header da Tabela
      document.getElementById('table-header').innerHTML = config.cols.map(col => `
        <th class="${col.align === 'right' ? 'text-right' : 'text-left'}">${col.label}</th>
      `).join('');

      // Linhas da Tabela
      document.getElementById('table-body').innerHTML = filtered.map(row => `
        <tr>
          ${config.cols.map(col => `
            <td class="${col.align === 'right' ? 'text-right' : 'text-left'}">
              ${row[col.key] !== null && row[col.key] !== undefined ? row[col.key] : ''}
            </td>
          `).join('')}
        </tr>
      `).join('');

      // Rodapé com Totais
      document.getElementById('table-footer').innerHTML = config.cols.map((col, idx) => {
        if (idx === 0) return `<td class="text-amber-400">Total</td>`;
        if (col.sum) {
          const sum = filtered.reduce((acc, curr) => acc + (Number(curr[col.key]) || 0), 0);
          return `<td class="text-right text-amber-400">${sum.toLocaleString('pt-BR')}</td>`;
        }
        return `<td></td>`;
      }).join('');
    }

    // Ações de Troca de Aba
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active-tab'));
        btn.classList.add('active-tab');
        currentTab = btn.getAttribute('data-tab');
        render();
      });
    });

    // Eventos dos Filtros e da Busca em Tempo Real
    document.getElementById('input-search').addEventListener('input', render);
    ['filter-os', 'filter-cod-produto', 'filter-cliente', 'filter-os-prod'].forEach(id => {
      document.getElementById(id).addEventListener('change', render);
    });

    fetchData();
  </script>
</body>
</html>
