<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Semanal de Produção - Sintercan</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Cores Padrão Consultoria RF */
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background-color: #070d1e; color: #f8fafc; }
        .bg-rf-card { background-color: #0f172a; }
        .bg-rf-header { background-color: #0b1329; }
        .border-rf { border-color: #1e293b; }
        
        .custom-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #0b1329; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        
        .active-tab {
            background-color: #f59e0b !important;
            color: #070d1e !important;
            font-weight: 800 !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col custom-scroll text-slate-100">

    <!-- HEADER PRINCIPAL -->
    <header class="bg-rf-header border-b border-rf sticky top-0 z-50 shadow-lg">
        <div class="max-w-[1700px] mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            
            <div class="flex items-center gap-3">
                <div class="flex items-center justify-center p-1 bg-slate-900/90 rounded-xl border border-slate-800 shadow-inner">
                    <div class="p-2 bg-amber-500 rounded-lg text-slate-950 font-black flex items-center justify-center">
                        <i data-lucide="cog" class="w-6 h-6 animate-spin-slow"></i>
                    </div>
                </div>
                <div>
                    <h1 class="text-lg font-black tracking-wider text-white uppercase flex items-center gap-2">
                        CONSULTORIA RF <span class="text-xs bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded font-mono">v6.5</span>
                    </h1>
                    <p class="text-xs text-slate-400 font-medium">Sintercan - Controle Estratégico de Estoque & Peças</p>
                </div>
            </div>

            <!-- Botão Atualizar -->
            <div class="flex items-center gap-3">
                <button id="btnRefresh" onclick="fetchData()" class="flex items-center gap-2 px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-xl font-bold text-xs transition shadow-lg shadow-amber-500/10">
                    <i data-lucide="refresh-cw" class="w-4 h-4" id="refreshIcon"></i>
                    Atualizar Dados
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-[1700px] w-full mx-auto p-4 flex flex-col gap-4 flex-1">
        
        <!-- CARDS INDICADORES (TOP KPIS) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-rf-card p-4 rounded-2xl border border-rf shadow-md flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-[11px] font-bold uppercase tracking-wider">TOTAL DE ITENS (FILTRADO)</p>
                    <h3 id="kpiTotalItens" class="text-3xl font-black text-white mt-1">0</h3>
                </div>
                <div class="p-3 bg-blue-500/10 text-blue-400 rounded-xl border border-blue-500/20"><i data-lucide="boxes" class="w-6 h-6"></i></div>
            </div>

            <div class="bg-rf-card p-4 rounded-2xl border border-rf shadow-md flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-[11px] font-bold uppercase tracking-wider">QUANTIDADE SOLICITADA</p>
                    <h3 id="kpiQtdSolicitada" class="text-3xl font-black text-amber-400 mt-1">0</h3>
                </div>
                <div class="p-3 bg-amber-500/10 text-amber-400 rounded-xl border border-amber-500/20"><i data-lucide="clipboard-list" class="w-6 h-6"></i></div>
            </div>

            <div class="bg-rf-card p-4 rounded-2xl border border-rf shadow-md flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-[11px] font-bold uppercase tracking-wider">QUANTIDADE DISPONÍVEL</p>
                    <h3 id="kpiQtdDisponivel" class="text-3xl font-black text-emerald-400 mt-1">0</h3>
                </div>
                <div class="p-3 bg-emerald-500/10 text-emerald-400 rounded-xl border border-emerald-500/20"><i data-lucide="check-circle-2" class="w-6 h-6"></i></div>
            </div>

            <div class="bg-rf-card p-4 rounded-2xl border border-rf shadow-md flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-[11px] font-bold uppercase tracking-wider">EM PRODUÇÃO</p>
                    <h3 id="kpiQtdProduzindo" class="text-3xl font-black text-indigo-400 mt-1">0</h3>
                </div>
                <div class="p-3 bg-indigo-500/10 text-indigo-400 rounded-xl border border-indigo-500/20"><i data-lucide="factory" class="w-6 h-6"></i></div>
            </div>
        </div>

        <!-- BARRA DE FILTROS AVANÇADOS -->
        <div class="bg-rf-card p-4 rounded-2xl border border-rf flex flex-wrap items-center gap-3 shadow-md">
            
            <!-- Busca Geral -->
            <div class="flex items-center gap-2 flex-1 min-w-[280px] bg-slate-950 border border-slate-800 rounded-xl px-3 py-2">
                <i data-lucide="search" class="w-4 h-4 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="applyFilters()" placeholder="Pesquisar qualquer coisa (OS, Pedido, SC, Título, Cliente...)" 
                       class="w-full text-xs bg-transparent text-white focus:outline-none placeholder-slate-500">
            </div>

            <!-- Filtro de Cliente -->
            <div class="flex items-center gap-2 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 min-w-[200px]">
                <i data-lucide="user" class="w-4 h-4 text-slate-400"></i>
                <select id="filterCliente" onchange="applyFilters()" class="w-full text-xs bg-transparent text-white focus:outline-none cursor-pointer">
                    <option value="" class="bg-slate-900">Todos os Clientes</option>
                </select>
            </div>

            <!-- Filtro de Código do Produto -->
            <div class="flex items-center gap-2 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 min-w-[180px]">
                <i data-lucide="tag" class="w-4 h-4 text-slate-400"></i>
                <select id="filterProduto" onchange="applyFilters()" class="w-full text-xs bg-transparent text-white focus:outline-none cursor-pointer">
                    <option value="" class="bg-slate-900">Todos os Produtos</option>
                </select>
            </div>

            <!-- Botão Limpar Filtros -->
            <button onclick="resetFilters()" class="flex items-center gap-2 px-4 py-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-xl font-bold text-xs transition">
                <i data-lucide="filter-x" class="w-4 h-4"></i>
                Limpar Filtros
            </button>
        </div>

        <!-- NAVEGAÇÃO POR ABAS (SUPERIOR DA TABELA) -->
        <div class="flex border-b border-rf gap-2 overflow-x-auto custom-scroll pt-2">
            <button id="tab-estoque" onclick="switchTab('estoque')" class="tab-btn px-5 py-2.5 text-xs font-bold rounded-t-xl border-b-2 border-amber-500 bg-rf-card text-amber-400 flex items-center gap-2 whitespace-nowrap active-tab">
                <i data-lucide="box" class="w-4 h-4"></i>
                EM ESTOQUE
                <span id="badge-estoque" class="ml-1 bg-slate-950/60 px-2 py-0.5 rounded-full text-[10px]">0</span>
            </button>
            
            <button id="tab-orcamento" onclick="switchTab('orcamento')" class="tab-btn px-5 py-2.5 text-xs font-bold rounded-t-xl border-b-2 border-transparent text-slate-400 hover:text-slate-200 hover:bg-slate-900/50 flex items-center gap-2 whitespace-nowrap">
                <i data-lucide="file-text" class="w-4 h-4"></i>
                EM ESTOQUE PARA ORÇAMENTO
                <span id="badge-orcamento" class="ml-1 bg-slate-800 px-2 py-0.5 rounded-full text-[10px]">0</span>
            </button>

            <button id="tab-produzindo" onclick="switchTab('produzindo')" class="tab-btn px-5 py-2.5 text-xs font-bold rounded-t-xl border-b-2 border-transparent text-slate-400 hover:text-slate-200 hover:bg-slate-900/50 flex items-center gap-2 whitespace-nowrap">
                <i data-lucide="hammer" class="w-4 h-4"></i>
                PRODUZINDO
                <span id="badge-produzindo" class="ml-1 bg-slate-800 px-2 py-0.5 rounded-full text-[10px]">0</span>
            </button>

            <button id="tab-entregues" onclick="switchTab('entregues')" class="tab-btn px-5 py-2.5 text-xs font-bold rounded-t-xl border-b-2 border-transparent text-slate-400 hover:text-slate-200 hover:bg-slate-900/50 flex items-center gap-2 whitespace-nowrap">
                <i data-lucide="check-check" class="w-4 h-4"></i>
                ENTREGUES
                <span id="badge-entregues" class="ml-1 bg-slate-800 px-2 py-0.5 rounded-full text-[10px]">0</span>
            </button>

            <button id="tab-parciais" onclick="switchTab('parciais')" class="tab-btn px-5 py-2.5 text-xs font-bold rounded-t-xl border-b-2 border-transparent text-slate-400 hover:text-slate-200 hover:bg-slate-900/50 flex items-center gap-2 whitespace-nowrap">
                <i data-lucide="pie-chart" class="w-4 h-4"></i>
                PARCIAIS
                <span id="badge-parciais" class="ml-1 bg-slate-800 px-2 py-0.5 rounded-full text-[10px]">0</span>
            </button>
        </div>

        <!-- TABELA PRINCIPAL DE DADOS -->
        <div class="bg-rf-card rounded-2xl border border-rf overflow-hidden shadow-md flex-1 flex flex-col">
            <div class="overflow-x-auto custom-scroll flex-1">
                <table class="w-full text-left text-xs text-slate-300 border-collapse">
                    <thead class="bg-slate-950 text-slate-400 uppercase font-extrabold border-b border-rf text-[10px] sticky top-0">
                        <tr id="tableHeader">
                            <!-- Colunas Dinâmicas via JS -->
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-800/60 font-medium">
                        <!-- Conteúdo da Tabela -->
                    </tbody>
                </table>
            </div>

            <!-- Mensagem Sem Registros -->
            <div id="emptyMessage" class="hidden p-12 text-center text-slate-500">
                <i data-lucide="inbox" class="w-10 h-10 mx-auto mb-2 opacity-30"></i>
                Nenhum registro encontrado para os filtros selecionados.
            </div>

            <!-- Rodapé da Tabela com Totais -->
            <div class="bg-slate-950 p-3 border-t border-rf flex justify-between items-center text-xs font-bold text-slate-300">
                <span>TOTAL DE REGISTROS: <strong id="totalRegistros" class="text-amber-400">0</strong></span>
                <span id="sumRodape" class="font-mono text-emerald-400"></span>
            </div>
        </div>
    </main>

    <script>
        const API_URL = 'https://sintercan.consultoriarf.net/estoque_sc';
        let rawData = [];
        let filteredData = [];
        let activeTab = 'estoque';

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            fetchData();
        });

        async function fetchData() {
            const icon = document.getElementById('refreshIcon');
            if (icon) icon.classList.add('animate-spin');

            try {
                const response = await fetch(`${API_URL}?_t=${Date.now()}`);
                if (!response.ok) throw new Error(`HTTP Status: ${response.status}`);

                rawData = await response.json();
                populateDropdowns();
                updateBadges();
                applyFilters();
            } catch (err) {
                console.error("Erro ao conectar com API:", err);
            } finally {
                if (icon) icon.classList.remove('animate-spin');
            }
        }

        function populateDropdowns() {
            const clienteSelect = document.getElementById('filterCliente');
            const produtoSelect = document.getElementById('filterProduto');

            const clientes = [...new Set(rawData.map(i => i.cliente).filter(Boolean))].sort();
            const produtos = [...new Set(rawData.map(i => i.codigo_interno).filter(Boolean))].sort();

            clienteSelect.innerHTML = '<option value="" class="bg-slate-900">Todos os Clientes</option>';
            clientes.forEach(c => clienteSelect.innerHTML += `<option value="${c}" class="bg-slate-900">${c}</option>`);

            produtoSelect.innerHTML = '<option value="" class="bg-slate-900">Todos os Produtos</option>';
            produtos.forEach(p => produtoSelect.innerHTML += `<option value="${p}" class="bg-slate-900">${p}</option>`);
        }

        function updateBadges() {
            document.getElementById('badge-estoque').textContent = rawData.filter(i => Number(i.qtde_disponivel) > 0).length;
            document.getElementById('badge-orcamento').textContent = rawData.filter(i => i.n_orcamento).length;
            document.getElementById('badge-produzindo').textContent = rawData.filter(i => Number(i.qtde_produzindo) > 0).length;
            document.getElementById('badge-entregues').textContent = rawData.filter(i => i.entregue && i.entregue.includes('Total')).length;
            document.getElementById('badge-parciais').textContent = rawData.filter(i => i.entregue && i.entregue.includes('Parcial')).length;
        }

        function switchTab(tab) {
            activeTab = tab;
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active-tab');
                btn.classList.add('text-slate-400', 'border-transparent');
            });

            const currentBtn = document.getElementById(`tab-${tab}`);
            if (currentBtn) currentBtn.classList.add('active-tab');

            applyFilters();
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase().trim();
            const selectedCliente = document.getElementById('filterCliente').value;
            const selectedProduto = document.getElementById('filterProduto').value;

            // 1. Filtragem por Aba Ativa
            let tabData = rawData.filter(item => {
                if (activeTab === 'estoque') return Number(item.qtde_disponivel) > 0;
                if (activeTab === 'orcamento') return item.n_orcamento !== null && item.n_orcamento !== "";
                if (activeTab === 'produzindo') return Number(item.qtde_produzindo) > 0;
                if (activeTab === 'entregues') return item.entregue && item.entregue.includes('Total');
                if (activeTab === 'parciais') return item.entregue && item.entregue.includes('Parcial');
                return true;
            });

            // 2. Aplicação dos Filtros do Usuário
            filteredData = tabData.filter(item => {
                if (selectedCliente && item.cliente !== selectedCliente) return false;
                if (selectedProduto && item.codigo_interno !== selectedProduto) return false;

                if (search) {
                    const fullText = `${item.n_os} ${item.cod_os_completo} ${item.titulo} ${item.codigo_interno} ${item.nome} ${item.cliente} ${item.n_orcamento}`.toLowerCase();
                    if (!fullText.includes(search)) return false;
                }

                return true;
            });

            updateKPIs();
            renderTable();
        }

        function updateKPIs() {
            document.getElementById('kpiTotalItens').textContent = filteredData.length;
            document.getElementById('kpiQtdSolicitada').textContent = filteredData.reduce((acc, i) => acc + (Number(i.qtde_solicitada) || 0), 0);
            document.getElementById('kpiQtdDisponivel').textContent = filteredData.reduce((acc, i) => acc + (Number(i.qtde_disponivel) || 0), 0);
            document.getElementById('kpiQtdProduzindo').textContent = filteredData.reduce((acc, i) => acc + (Number(i.qtde_produzindo) || 0), 0);
        }

        function renderTable() {
            const thead = document.getElementById('tableHeader');
            const tbody = document.getElementById('tableBody');
            const emptyMsg = document.getElementById('emptyMessage');

            tbody.innerHTML = '';

            if (filteredData.length === 0) {
                emptyMsg.classList.remove('hidden');
                document.getElementById('totalRegistros').textContent = '0';
                document.getElementById('sumRodape').textContent = '';
                return;
            }

            emptyMsg.classList.add('hidden');
            document.getElementById('totalRegistros').textContent = filteredData.length;

            // Configuração de Colunas Dinâmicas
            let columns = [
                { label: 'Nº OS / Cód. Completo', render: i => `<span class="font-bold text-amber-400">OS #${i.n_os || '-'}</span><br><span class="text-[10px] text-slate-500 font-mono">${i.cod_os_completo || '-'}</span>` },
                { label: 'Item / Descrição', render: i => `<div class="font-semibold text-slate-200">${i.titulo || '-'}</div><div class="text-[10px] text-slate-400">${i.nome || ''}</div>` },
                { label: 'Cód. Interno', render: i => `<span class="bg-slate-950 px-2 py-0.5 rounded border border-slate-800 font-mono text-slate-300">${i.codigo_interno || '-'}</span>` },
                { label: 'Cliente', render: i => `<span class="text-slate-300 font-medium">${i.cliente || '-'}</span>` },
                { label: 'Status', render: i => `<span class="px-2 py-0.5 rounded text-[10px] font-bold ${getStatusClass(i.entregue)}">${i.entregue || 'Sem Status'}</span>` }
            ];

            if (activeTab === 'parciais' || activeTab === 'estoque') {
                columns.push({ label: 'Qtd. Solicitada', render: i => `<span class="font-mono text-amber-400">${i.qtde_solicitada || 0}</span>` });
                columns.push({ label: 'Qtd. Disponível', render: i => `<span class="font-mono text-emerald-400 font-bold">${i.qtde_disponivel || 0}</span>` });
            }

            // Renderiza Header
            thead.innerHTML = columns.map(c => `<th class="p-3.5">${c.label}</th>`).join('');

            // Renderiza Linhas
            filteredData.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-800/40 transition border-b border-slate-800/40';
                tr.innerHTML = columns.map(c => `<td class="p-3">${c.render(item)}</td>`).join('');
                tbody.appendChild(tr);
            });

            lucide.createIcons();
        }

        function getStatusClass(status) {
            if (!status) return 'bg-slate-800 text-slate-400';
            if (status.includes('Total')) return 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
            if (status.includes('Parcial')) return 'bg-amber-500/20 text-amber-400 border border-amber-500/30';
            return 'bg-blue-500/20 text-blue-400 border border-blue-500/30';
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('filterCliente').value = '';
            document.getElementById('filterProduto').value = '';
            applyFilters();
        }
    </script>
</body>
</html>
