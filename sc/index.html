<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard de Controle de Estoque de Peças</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Topbar -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-boxes-stacked text-blue-500 text-2xl"></i>
        <h1 class="text-xl font-bold tracking-wide">Gestão de Estoque - Sintercan</h1>
      </div>
      <button id="btn-refresh" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
        <i class="fa-solid fa-rotate-right" id="refresh-icon"></i> Atualizar Dados
      </button>
    </div>
  </header>

  <!-- Content Container -->
  <main class="max-w-7xl mx-auto p-4 sm:p-6 w-full flex-grow flex flex-col gap-6">

    <!-- KPI Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Total de Itens</p>
          <h3 id="kpi-total-itens" class="text-2xl font-bold text-white mt-1">0</h3>
        </div>
        <div class="p-3 bg-blue-500/10 text-blue-400 rounded-lg"><i class="fa-solid fa-layer-group text-xl"></i></div>
      </div>

      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Qtd Solicitada</p>
          <h3 id="kpi-qtd-solicitada" class="text-2xl font-bold text-amber-400 mt-1">0</h3>
        </div>
        <div class="p-3 bg-amber-500/10 text-amber-400 rounded-lg"><i class="fa-solid fa-clipboard-list text-xl"></i></div>
      </div>

      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Qtd Utilizada / Entregue</p>
          <h3 id="kpi-qtd-entregue" class="text-2xl font-bold text-emerald-400 mt-1">0</h3>
        </div>
        <div class="p-3 bg-emerald-500/10 text-emerald-400 rounded-lg"><i class="fa-solid fa-check-double text-xl"></i></div>
      </div>

      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Em Produção</p>
          <h3 id="kpi-qtd-produzindo" class="text-2xl font-bold text-indigo-400 mt-1">0</h3>
        </div>
        <div class="p-3 bg-indigo-500/10 text-indigo-400 rounded-lg"><i class="fa-solid fa-gears text-xl"></i></div>
      </div>
    </div>

    <!-- Charts Section -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-sm lg:col-span-1">
        <h2 class="text-md font-semibold text-slate-200 mb-4">Status de Entrega</h2>
        <div class="relative h-64 flex justify-center items-center">
          <canvas id="chart-status"></canvas>
        </div>
      </div>

      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-sm lg:col-span-2">
        <h2 class="text-md font-semibold text-slate-200 mb-4">Top 10 Peças Solicitadas</h2>
        <div class="relative h-64">
          <canvas id="chart-pecas"></canvas>
        </div>
      </div>
    </div>

    <!-- Data Table & Search -->
    <div class="bg-slate-800 rounded-xl border border-slate-700 shadow-sm flex flex-col overflow-hidden">
      <div class="p-4 border-b border-slate-700 flex flex-col sm:flex-row gap-4 justify-between items-center">
        <h2 class="text-md font-semibold text-slate-200">Ordens de Serviço e Peças</h2>
        <div class="relative w-full sm:w-72">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="text" id="input-search" placeholder="Buscar por N° OS, Código, Peça..." class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-9 pr-4 py-2 text-sm focus:outline-none focus:border-blue-500 text-slate-200 placeholder-slate-500">
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-900/50 text-slate-400 uppercase text-xs">
            <tr>
              <th class="px-4 py-3">Nº OS</th>
              <th class="px-4 py-3">Código Interno</th>
              <th class="px-4 py-3">Nome da Peça</th>
              <th class="px-4 py-3 text-center">Qtd Sol.</th>
              <th class="px-4 py-3 text-center">Qtd Ent.</th>
              <th class="px-4 py-3 text-center">Status</th>
            </tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-slate-700/50">
            <!-- Dynamic Content -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    const API_URL = 'https://sintercan.consultoriarf.net/estoque_sc';
    let rawData = [];
    let statusChartInstance = null;
    let pecasChartInstance = null;

    async function fetchData() {
      const refreshIcon = document.getElementById('refresh-icon');
      refreshIcon.classList.add('fa-spin');

      try {
        const response = await fetch(API_URL);
        rawData = await response.json();
        
        updateKPIs(rawData);
        renderCharts(rawData);
        renderTable(rawData);
      } catch (error) {
        console.error('Erro ao carregar os dados da API:', error);
        alert('Não foi possível carregar os dados. Verifique a API ou o acesso CORS.');
      } finally {
        refreshIcon.classList.remove('fa-spin');
      }
    }

    function updateKPIs(data) {
      document.getElementById('kpi-total-itens').innerText = data.length.toLocaleString('pt-BR');
      
      const totalSolicitado = data.reduce((acc, item) => acc + (Number(item.qtde_solicitada) || 0), 0);
      const totalEntregue = data.reduce((acc, item) => acc + (Number(item.qtde_entregue) || 0), 0);
      const totalProduzindo = data.reduce((acc, item) => acc + (Number(item.qtde_produzindo) || 0), 0);

      document.getElementById('kpi-qtd-solicitada').innerText = totalSolicitado.toLocaleString('pt-BR');
      document.getElementById('kpi-qtd-entregue').innerText = totalEntregue.toLocaleString('pt-BR');
      document.getElementById('kpi-qtd-produzindo').innerText = totalProduzindo.toLocaleString('pt-BR');
    }

    function renderCharts(data) {
      // 1. Status Chart
      const statusCounts = {};
      data.forEach(item => {
        const status = item.entregue || 'Sem Status';
        statusCounts[status] = (statusCounts[status] || 0) + 1;
      });

      const ctxStatus = document.getElementById('chart-status').getContext('2d');
      if (statusChartInstance) statusChartInstance.destroy();

      statusChartInstance = new Chart(ctxStatus, {
        type: 'doughnut',
        data: {
          labels: Object.keys(statusCounts),
          datasets: [{
            data: Object.values(statusCounts),
            backgroundColor: ['#10b981', '#f59e0b', '#ef4444', '#3b82f6', '#8b5cf6'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { color: '#94a3b8' } }
          }
        }
      });

      // 2. Top peças
      const topPecas = [...data]
        .sort((a, b) => (Number(b.qtde_solicitada) || 0) - (Number(a.qtde_solicitada) || 0))
        .slice(0, 10);

      const ctxPecas = document.getElementById('chart-pecas').getContext('2d');
      if (pecasChartInstance) pecasChartInstance.destroy();

      pecasChartInstance = new Chart(ctxPecas, {
        type: 'bar',
        data: {
          labels: topPecas.map(item => item.codigo_interno || item.nome?.substring(0, 15) + '...'),
          datasets: [{
            label: 'Quantidade Solicitada',
            data: topPecas.map(item => Number(item.qtde_solicitada) || 0),
            backgroundColor: '#3b82f6',
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { ticks: { color: '#94a3b8' }, grid: { display: false } },
            y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
          },
          plugins: {
            legend: { display: false }
          }
        }
      });
    }

    function renderTable(data) {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-slate-500">Nenhum registro encontrado.</td></tr>`;
        return;
      }

      data.forEach(item => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-700/30 transition border-b border-slate-700/40';

        tr.innerHTML = `
          <td class="px-4 py-3 font-semibold text-slate-200">${item.cod_os_completo || item.n_os || '-'}</td>
          <td class="px-4 py-3 text-slate-400">${item.codigo_interno || '-'}</td>
          <td class="px-4 py-3 font-medium text-slate-200 max-w-xs truncate" title="${item.nome}">${item.nome || '-'}</td>
          <td class="px-4 py-3 text-center text-amber-400 font-semibold">${item.qtde_solicitada ?? 0}</td>
          <td class="px-4 py-3 text-center text-emerald-400 font-semibold">${item.qtde_entregue ?? 0}</td>
          <td class="px-4 py-3 text-center">
            <span class="px-2.5 py-1 text-xs rounded-full font-medium ${getStatusBadgeClass(item.entregue)}">
              ${item.entregue || 'N/A'}
            </span>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function getStatusBadgeClass(status) {
      if (!status) return 'bg-slate-700 text-slate-300';
      if (status.toLowerCase().includes('total')) return 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
      if (status.toLowerCase().includes('parcial')) return 'bg-amber-500/10 text-amber-400 border border-amber-500/20';
      return 'bg-blue-500/10 text-blue-400 border border-blue-500/20';
    }

    // Filter Logic
    document.getElementById('input-search').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = rawData.filter(item => 
        (item.n_os && String(item.n_os).toLowerCase().includes(query)) ||
        (item.cod_os_completo && item.cod_os_completo.toLowerCase().includes(query)) ||
        (item.codigo_interno && item.codigo_interno.toLowerCase().includes(query)) ||
        (item.nome && item.nome.toLowerCase().includes(query))
      );
      renderTable(filtered);
    });

    document.getElementById('btn-refresh').addEventListener('click', fetchData);

    // Initial Load
    fetchData();
  </script>
</body>
</html>
