<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faturamento - Sintercan</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../LOGO MINIMALISTA.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-950 text-slate-100">

    <!-- HEADER -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <a href="../" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl transition border border-slate-700 flex items-center justify-center" title="Voltar ao Menu">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </a>
                <div class="flex items-center justify-center p-1 bg-slate-950/80 rounded-xl border border-slate-800 shadow-inner">
                    <img src="../logo.png" alt="Logo" class="h-10 max-h-12 w-auto object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="hidden p-2 bg-amber-500 rounded-xl text-slate-950 font-bold items-center justify-center">
                        <i data-lucide="receipt" class="w-6 h-6"></i>
                    </div>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-wide text-white">Sintercan</h1>
                    <p class="text-xs text-slate-400">Módulo de Faturamento</p>
                </div>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL (EM BREVE) -->
    <main class="max-w-7xl w-full mx-auto p-4 flex-1 flex items-center justify-center">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-12 text-center max-w-lg shadow-2xl space-y-4">
            <div class="w-16 h-16 bg-amber-500/10 text-amber-400 rounded-2xl border border-amber-500/20 flex items-center justify-center mx-auto">
                <i data-lucide="clock" class="w-8 h-8"></i>
            </div>
            <h2 class="text-2xl font-black text-white">Módulo em Desenvolvimento</h2>
            <p class="text-sm text-slate-400">
                O módulo de <strong class="text-amber-400">Faturamento</strong> está em fase de construção e em breve estará disponível para consumo de dados.
            </p>
            <div class="pt-4">
                <a href="../" class="inline-flex items-center gap-2 px-5 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-xs rounded-xl transition">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> Voltar ao Menu
                </a>
            </div>
        </div>
    </main>

    <script>
        // VALIDAÇÃO DE SESSÃO E PERMISSÃO DE ACESSO
        const sessionData = localStorage.getItem('sintercan_user');
        if (!sessionData) {
            window.location.href = '../';
        }

        const currentUser = JSON.parse(sessionData);
        if (Number(currentUser.u_faturamento) !== 1) {
            alert("Acesso negado para este módulo.");
            window.location.href = '../';
        }

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });
    </script>
</body>
</html>
